services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - .:/app
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 2s
      timeout: 3s
      retries: 20

  client:
    build: .
    command: python scripts/concurrent_booking_client.py --base-url http://api:8000
    volumes:
      - .:/app
    depends_on:
      api:
        condition: service_healthy

  tests:
    build: .
    command: pytest
    volumes:
      - .:/app
